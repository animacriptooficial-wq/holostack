name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build OpenNext
        run: npx --yes @opennextjs/cloudflare@1.20.7 build
        env:
          NEXT_PUBLIC_OPENAI_API_KEY: ${{ secrets.NEXT_PUBLIC_OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SYNC_GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_BRANCH: ${{ secrets.GH_BRANCH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          push_secret() { echo "$2" | npx --yes wrangler@4 secret put "$1" --name holostack; }
          [ -n "$OPENAI_API_KEY" ] && push_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          [ -n "$SYNC_GITHUB_TOKEN" ] && push_secret GITHUB_TOKEN "$SYNC_GITHUB_TOKEN"
          [ -n "$GH_REPO" ] && push_secret GITHUB_REPO "$GH_REPO"
          [ -n "$GH_BRANCH" ] && push_secret GITHUB_BRANCH "$GH_BRANCH"
          [ -n "$SUPABASE_URL" ] && push_secret SUPABASE_URL "$SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && push_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$SUPABASE_ANON_KEY" ] && push_secret SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"